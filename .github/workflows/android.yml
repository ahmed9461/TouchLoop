name: Android
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Android SDK platform
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Check scheduler timing
        run: |
          javac -encoding UTF-8 -d build/timing app/src/main/java/io/github/ahmed9461/touchloop/Timing.java tools/TimingCheck.java
          java -cp build/timing io.github.ahmed9461.touchloop.TimingCheck
      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
